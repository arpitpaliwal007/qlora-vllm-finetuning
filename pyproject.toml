[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-vllm-finetuning"
version = "0.2.0"
description = "QLoRA fine-tuning, evaluation, release gating and quantized vLLM serving for grounded QA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pyyaml>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
# Exact, tested pins live in requirements-*.txt; these ranges only guard against known-incompatible majors.
train = [
  "torch>=2.13,<2.16",
  "transformers>=5.16,<5.23",
  "peft>=0.21,<0.22",
  "bitsandbytes>=0.50,<0.51",
  "accelerate>=1.15,<2",
  "datasets>=5.1,<6",
]
quantize = ["llmcompressor>=0.15,<0.16"]
serve = ["vllm>=0.32,<0.33"]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
