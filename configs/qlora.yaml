# Replace this with a model you have access to and are licensed to use.
model_name: Qwen/Qwen2.5-1.5B-Instruct
dataset_path: data/train.jsonl
output_dir: artifacts/qlora-adapter

# Split 5% of data for evaluation; use 0 to disable evaluation.
validation_split: 0.05
max_seq_length: 2048

# QLoRA / bitsandbytes
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Training
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_ratio: 0.03
logging_steps: 10
save_steps: 100
save_total_limit: 2
eval_steps: 100
seed: 42
bf16: true
fp16: false
gradient_checkpointing: true
resume_from_checkpoint: null
