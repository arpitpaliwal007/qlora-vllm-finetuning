# Smoke-run profile: a few optimizer steps on real data to validate the GPU pipeline end to end.
# Data: python -m qlora_vllm.prepare_data --source hf --out data/squad_qa_smoke --profile smoke
model_name: Qwen/Qwen2.5-1.5B-Instruct
model_revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
dataset_path: data/squad_qa_smoke/train.jsonl
validation_path: data/squad_qa_smoke/validation.jsonl
output_dir: artifacts/qlora-adapter-smoke

max_seq_length: 1024
on_too_long: drop

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

num_train_epochs: 1
max_steps: 20
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.1
logging_steps: 5
save_steps: 10
save_total_limit: 1
eval_steps: 10
seed: 42
precision: auto
gradient_checkpointing: true
resume_from_checkpoint: null
